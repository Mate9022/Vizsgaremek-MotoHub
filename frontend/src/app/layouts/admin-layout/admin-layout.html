<div class="app-layout">

    <aside class="sidebar">

        <div class="logo">
            <span class="logo-icon">🏍</span>
            <span class="logo-text">MotoHub</span>
        </div>

        <nav class="navigation">

            <a
                routerLink="/admin"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >

                Dashboard
            </a>

            <a
                routerLink="/admin/customers"
                routerLinkActive="active"
            >
                <span>👤</span>
                Ügyfelek
            </a>

            <a
                routerLink="/admin/motorcycles"
                routerLinkActive="active"
            >
                <span>🏍</span>
                Motorkerékpárok
            </a>

            <a
                routerLink="/admin/work-orders"
                routerLinkActive="active"
            >

                Munkalapok
            </a>

        </nav>

        <div class="sidebar-bottom">

    <a href="#">
        <span>⚙</span>
        Beállítások
    </a>

    <button
        type="button"
        class="logout-button"
        (click)="logout()"
    >
        <span>↪</span>
        Kijelentkezés
    </button>

</div>

    </aside>


    <div class="main-area">

        <header class="topbar">

            <div class="page-title">
                MotoHub
            </div>

            <div class="user-area">

        <main class="content">
